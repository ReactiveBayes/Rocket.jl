name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags: '*'
  schedule:
    - cron: '44 9 * * 1' # run the cron job one time per week, on Mondays
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.3'
          - '1.4'
          - '1.5'
          - '1.6'
          - '1.7'
          - '1.8'
          - '1.9'
          - '1.10'
          - '1.11'
          - '1.12'
          - '1.13'
        os:
          - ubuntu-latest
        arch:
          - x64
        experimental:
          - false
        include:
          # `nightly` is informational only, it is allowed to fail without
          # failing the whole run (and without blocking the `docs` job)
          - version: 'nightly'
            os: ubuntu-latest
            arch: x64
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v5
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      # `julia-actions/julia-runtest` always forwards `julia_args` to `Pkg.test`, which is
      # unsupported (and emits a warning) before Julia 1.6, so older versions call `Pkg.test` directly
      - uses: julia-actions/julia-runtest@v1
        if: ${{ !contains(fromJSON('["1.3", "1.4", "1.5"]'), matrix.version) }}
        env:
          USE_DEV: "false"
          LOG_USING_RXINFER: "false"
      - name: Run tests (Julia < 1.6)
        if: ${{ contains(fromJSON('["1.3", "1.4", "1.5"]'), matrix.version) }}
        run: julia --color=yes --project=@. -e 'using Pkg; Pkg.test(coverage=true)'
        env:
          USE_DEV: "false"
          LOG_USING_RXINFER: "false"
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: julia-actions/setup-julia@v3
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'
      - run: julia --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
